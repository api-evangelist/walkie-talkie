name: Walkie-Talkie
description: 'Walkie-Talkie is a Gen Z social audio platform built by Picslo Corp that hosts live
  audio rooms called "frequencies" — public or private channels where users tune in and talk with
  friends in high-fidelity audio anytime, anywhere. Thousands of public frequencies run at any given
  time, connecting people around topics they choose to discuss, alongside private frequencies between
  close friends. The company raised $3.25M in pre-seed funding from investors including Partech, Breega,
  Kima Ventures, Heroic Ventures, TI Platform Ventures, LDV Partners, and Diaspora Ventures. It is a
  consumer mobile application with no public developer API surface at this time.'
